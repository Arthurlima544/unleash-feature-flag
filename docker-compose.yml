version: "3.9"

services:
  # ── Unleash ──────────────────────────────────────────────────────────────
  unleash-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: unleash
      POSTGRES_USER: unleash_user
      POSTGRES_PASSWORD: unleash_password
    volumes:
      - unleash-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unleash_user -d unleash"]
      interval: 5s
      timeout: 5s
      retries: 10

  unleash:
    image: unleashorg/unleash-server:6
    ports:
      - "4242:4242"
    environment:
      DATABASE_URL: postgresql://unleash_user:unleash_password@unleash-db/unleash
      DATABASE_SSL: "false"
      LOG_LEVEL: warn
      # Pre-seed tokens so no manual UI setup is required
      INIT_ADMIN_API_TOKENS: "*:*.unleash-admin-token"
      INIT_CLIENT_API_TOKENS: "default:development.unleash-client-token"
      INIT_FRONTEND_API_TOKENS: "default:development.unleash-frontend-token"
    depends_on:
      unleash-db:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:4242/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 15

  # ── Backend ───────────────────────────────────────────────────────────────
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=unleash
      - UNLEASH_API_URL=http://unleash:4242/api
      - UNLEASH_CLIENT_KEY=default:development.unleash-client-token
      - UNLEASH_ADMIN_KEY=*:*.unleash-admin-token
    depends_on:
      unleash:
        condition: service_healthy

  # ── Angular ───────────────────────────────────────────────────────────────
  frontend-web:
    build: ./frontend-web
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  unleash-db-data:
